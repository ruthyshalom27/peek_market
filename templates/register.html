{% extends "base.html" %}{% block body %}
<div class="auth-shell">
<div class="auth-brand"><a class="peek-brand" href="/"><span class="pk">Pk</span><span><b>Peek</b><small>market watchlist digest</small></span></a></div>
<div class="auth-card">
  <div class="auth-head"><h1>Create your watchlist</h1><p>Your baseline travels with your account, so any device picks up where you left off.</p></div>
  <button class="google-btn"><span>G</span> Continue with Google</button>
  <div class="or"><span></span>or email<span></span></div>
  <form method="post">
    <label>Name<input name="name" placeholder="Your name" required></label>
    <label>Email<input name="email" type="email" placeholder="you@example.com" required></label>
    <label>Password<div class="pass"><input name="password" type="password" placeholder="Create a password" required><i class="bi bi-eye"></i></div></label>
    <button class="dark-btn wide">Create account</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
</div>
</div>
{% endblock %}
